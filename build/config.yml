version: '3'

info:
  companyName: "Chomosuke9"
  productName: "WazzapAgent"
  productIdentifier: "io.github.chomosuke9.wazzapagent"
  description: "WazzapAgent desktop and mobile application"
  copyright: "(c) 2026, Chomosuke9"
  comments: "Wails v3 beta.23 application shell"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task common:install:frontend:deps
      type: once
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task build
      type: blocking
    - cmd: wails3 task run
      type: primary

fileAssociations: []
other: []
